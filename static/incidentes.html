<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubNOC — Incidentes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#070d14;--panel:#0d1a26;--panel2:#111f30;--border:#1a3a5c;--green:#00ff88;--blue:#00aaff;--red:#ff3366;--yellow:#ffcc00;--orange:#ff8800;--text:#c8dde8;--dim:#4a7a9b;}
  body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
  .logo{font-family:'Share Tech Mono',monospace;font-size:18px;color:var(--blue);letter-spacing:3px;}
  .nav-links{display:flex;gap:4px;}
  .nav-link{padding:6px 14px;font-size:12px;letter-spacing:1px;text-decoration:none;color:var(--dim);border:1px solid transparent;transition:.2s;cursor:pointer;font-family:'Share Tech Mono',monospace;}
  .nav-link:hover,.nav-link.ativo{color:var(--blue);border-color:var(--border);}
  .topbar-right{display:flex;align-items:center;gap:16px;}
  .user-info{font-size:12px;color:var(--dim);font-family:'Share Tech Mono',monospace;}
  .btn-sair{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 12px;font-size:11px;cursor:pointer;}
  .btn-sair:hover{border-color:var(--red);color:var(--red);}
  .main{padding:20px 24px;display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start;}
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;grid-column:1/-1;}
  .page-title{font-family:'Share Tech Mono',monospace;font-size:16px;letter-spacing:3px;color:var(--blue);}
  .btn-novo{background:none;border:1px solid var(--red);color:var(--red);padding:8px 16px;font-size:12px;cursor:pointer;letter-spacing:2px;font-family:'Share Tech Mono',monospace;}
  .btn-novo:hover{background:rgba(255,51,102,.1);}

  /* Lista incidentes */
  .inc-lista{display:flex;flex-direction:column;gap:10px;}
  .inc-card{background:var(--panel);border:1px solid var(--border);padding:0;overflow:hidden;}
  .inc-card.aberto{border-left:4px solid var(--orange);}
  .inc-card.critico{border-left:4px solid var(--red);}
  .inc-card.resolvido{border-left:4px solid var(--green);opacity:.7;}
  .inc-card-header{padding:14px 16px;display:flex;align-items:flex-start;gap:12px;
    cursor:pointer;transition:.2s;}
  .inc-card-header:hover{background:rgba(0,170,255,.03);}
  .inc-impacto{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
  .imp-critico{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.5s infinite;}
  .imp-alto{background:var(--orange);box-shadow:0 0 6px var(--orange);}
  .imp-medio{background:var(--yellow);}
  .imp-baixo{background:var(--dim);}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .inc-info{flex:1;}
  .inc-titulo{font-size:14px;font-weight:700;margin-bottom:4px;}
  .inc-meta{font-size:11px;color:var(--dim);font-family:'Share Tech Mono',monospace;display:flex;gap:12px;flex-wrap:wrap;}
  .inc-actions{display:flex;gap:6px;flex-shrink:0;}
  .btn-sm{background:none;border:1px solid var(--border);color:var(--dim);padding:4px 10px;
    font-size:11px;cursor:pointer;font-family:'Share Tech Mono',monospace;}
  .btn-sm:hover{border-color:var(--blue);color:var(--blue);}
  .btn-sm.resolver{border-color:var(--green);color:var(--green);}
  .btn-sm.resolver:hover{background:rgba(0,255,136,.1);}

  .inc-timeline{display:none;border-top:1px solid var(--border);padding:14px 16px;
    background:var(--panel2);}
  .inc-timeline.show{display:block;}
  .tl-item{display:flex;gap:10px;margin-bottom:10px;}
  .tl-item:last-child{margin-bottom:0;}
  .tl-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;margin-top:5px;}
  .tl-dot.abertura{background:var(--red);}
  .tl-dot.atualizacao{background:var(--blue);}
  .tl-dot.resolucao{background:var(--green);}
  .tl-content{flex:1;}
  .tl-desc{font-size:13px;}
  .tl-meta{font-size:11px;color:var(--dim);font-family:'Share Tech Mono',monospace;margin-top:2px;}
  .tl-add{margin-top:10px;display:flex;gap:8px;}
  .tl-input{flex:1;background:rgba(0,170,255,.05);border:1px solid var(--border);
    color:var(--text);padding:8px 12px;font-size:12px;font-family:'Exo 2',sans-serif;outline:none;}
  .tl-input:focus{border-color:var(--blue);}
  .btn-tl{background:none;border:1px solid var(--blue);color:var(--blue);
    padding:7px 14px;font-size:11px;cursor:pointer;font-family:'Share Tech Mono',monospace;}

  .badge{display:inline-block;padding:2px 8px;font-size:10px;letter-spacing:1px;font-family:'Share Tech Mono',monospace;border-radius:2px;}
  .b-aberto{background:rgba(255,136,0,.15);color:var(--orange);border:1px solid rgba(255,136,0,.3);}
  .b-tratativa{background:rgba(255,204,0,.15);color:var(--yellow);border:1px solid rgba(255,204,0,.3);}
  .b-resolvido{background:rgba(0,255,136,.15);color:var(--green);border:1px solid rgba(0,255,136,.3);}

  /* Painel lateral — novo incidente */
  .lateral{position:sticky;top:70px;}
  .lateral-box{background:var(--panel);border:1px solid var(--border);border-top:2px solid var(--red);}
  .lat-header{padding:14px 16px;border-bottom:1px solid var(--border);
    font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--red);}
  .lat-body{padding:16px;}
  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:11px;letter-spacing:2px;color:var(--dim);
    margin-bottom:6px;font-family:'Share Tech Mono',monospace;text-transform:uppercase;}
  .form-row input,.form-row select,.form-row textarea{
    width:100%;background:rgba(0,170,255,.05);border:1px solid var(--border);
    color:var(--text);padding:9px 12px;font-size:13px;font-family:'Exo 2',sans-serif;outline:none;}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--red);}
  .form-row select option{background:var(--panel);}
  .form-row textarea{resize:vertical;min-height:60px;}
  .btn-abrir{width:100%;background:var(--red);border:none;color:#fff;
    padding:12px;font-family:'Share Tech Mono',monospace;font-size:12px;
    letter-spacing:2px;cursor:pointer;margin-top:4px;}
  .btn-abrir:hover{background:#cc2244;}

  .empty{text-align:center;padding:40px;color:var(--dim);font-family:'Share Tech Mono',monospace;}
  .filtro-bar{display:flex;gap:8px;margin-bottom:14px;}
  .filtro-btn{padding:5px 12px;font-size:11px;font-family:'Share Tech Mono',monospace;
    border:1px solid var(--border);background:none;color:var(--dim);cursor:pointer;}
  .filtro-btn.ativo{border-color:var(--blue);color:var(--blue);}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="logo">📡 HubNOC</div>
    <div class="nav-links">
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/chamados">Chamados</a>
      <a class="nav-link" href="/sensores">Sensores</a>
      <a class="nav-link ativo" href="/incidentes">Incidentes</a>
      <a class="nav-link" href="/cliente">Clientes</a>
      <a class="nav-link" href="/tv" target="_blank">📺 TV</a>
    </div>
  </div>
  <div class="topbar-right">
    <div class="user-info" id="user-nome">—</div>
    <button class="btn-sair" onclick="sair()">SAIR</button>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <div class="page-title">⚡ INCIDENTES DE REDE</div>
  </div>

  <!-- Lista -->
  <div>
    <div class="filtro-bar">
      <button class="filtro-btn ativo" onclick="filtrar('', this)">TODOS</button>
      <button class="filtro-btn" onclick="filtrar('aberto', this)">ABERTOS</button>
      <button class="filtro-btn" onclick="filtrar('em_tratativa', this)">EM TRATATIVA</button>
      <button class="filtro-btn" onclick="filtrar('resolvido', this)">RESOLVIDOS</button>
    </div>
    <div class="inc-lista" id="inc-lista">
      <div class="empty">Carregando...</div>
    </div>
  </div>

  <!-- Lateral: novo incidente -->
  <div class="lateral">
    <div class="lateral-box">
      <div class="lat-header">⚡ ABRIR INCIDENTE</div>
      <div class="lat-body">
        <div class="form-row">
          <label>Título</label>
          <input type="text" id="f-titulo" placeholder="Ex: OLT Neópolis DOWN">
        </div>
        <div class="form-row">
          <label>Tipo</label>
          <select id="f-tipo">
            <option value="equipamento">Equipamento</option>
            <option value="massivo">Massivo</option>
            <option value="link">Link</option>
            <option value="energia">Energia</option>
            <option value="outros">Outros</option>
          </select>
        </div>
        <div class="form-row">
          <label>Impacto</label>
          <select id="f-impacto">
            <option value="baixo">Baixo</option>
            <option value="medio" selected>Médio</option>
            <option value="alto">Alto</option>
            <option value="critico">Crítico</option>
          </select>
        </div>
        <div class="form-row">
          <label>Clientes Afetados</label>
          <input type="number" id="f-clientes" value="0" min="0">
        </div>
        <div class="form-row">
          <label>Descrição</label>
          <textarea id="f-desc" placeholder="Descreva o incidente..."></textarea>
        </div>
        <button class="btn-abrir" onclick="abrirIncidente()">⚡ ABRIR INCIDENTE</button>
      </div>
    </div>
  </div>
</div>

<script>
var API = '';
var token = localStorage.getItem('noc_token');
if(!token){ window.location.href = '/login'; }
document.getElementById('user-nome').textContent = localStorage.getItem('noc_nome') || '—';
var filtroAtual = '';
var timelineAberta = null;

function sair(){ localStorage.clear(); window.location.href = '/login'; }
function headers(){ return {'Content-Type':'application/json','Authorization':'Bearer '+token}; }

function filtrar(status, btn){
  filtroAtual = status;
  document.querySelectorAll('.filtro-btn').forEach(function(b){ b.classList.remove('ativo'); });
  btn.classList.add('ativo');
  carregar();
}

function carregar(){
  fetch(API+'/api/incidentes', {headers:headers()})
  .then(function(r){return r.json();})
  .then(function(lista){
    if(filtroAtual) lista = lista.filter(function(i){ return i.status === filtroAtual; });
    renderLista(lista);
  }).catch(function(){});
}

var impDot = {critico:'imp-critico',alto:'imp-alto',medio:'imp-medio',baixo:'imp-baixo'};
var impBadge = {aberto:'b-aberto',em_tratativa:'b-tratativa',resolvido:'b-resolvido'};

function renderLista(lista){
  var el = document.getElementById('inc-lista');
  if(!lista || !lista.length){
    el.innerHTML = '<div class="empty">✓ Nenhum incidente encontrado</div>';
    return;
  }
  var html = '';
  lista.forEach(function(inc){
    var cardCls = inc.status === 'resolvido' ? 'resolvido'
      : inc.impacto === 'critico' ? 'critico' : 'aberto';
    var dotCls = impDot[inc.impacto] || 'imp-baixo';
    var badgeCls = impBadge[inc.status] || 'b-aberto';
    var duracao = inc.duracao_min ? ' · '+Math.round(inc.duracao_min)+'min' : '';
    var resolverBtn = inc.status !== 'resolvido'
      ? '<button class="btn-sm resolver" onclick="resolver('+inc.id+',event)">✓ Resolver</button>' : '';

    html += '<div class="inc-card '+cardCls+'" id="inc-'+inc.id+'">' +
      '<div class="inc-card-header" onclick="toggleTimeline('+inc.id+')">' +
        '<span class="inc-impacto '+dotCls+'"></span>' +
        '<div class="inc-info">' +
          '<div class="inc-titulo">'+esc(inc.titulo)+'</div>' +
          '<div class="inc-meta">' +
            '<span class="badge '+badgeCls+'">'+esc(inc.status)+'</span>' +
            '<span>'+esc(inc.tipo)+'</span>' +
            '<span>impacto: '+esc(inc.impacto)+'</span>' +
            (inc.clientes_afetados ? '<span>'+inc.clientes_afetados+' clientes</span>' : '') +
            '<span>'+(inc.aberto_em||'').substring(0,16)+'</span>' +
            (duracao ? '<span>'+duracao+'</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="inc-actions">'+resolverBtn+
          '<button class="btn-sm" onclick="toggleTimeline('+inc.id+',event)">▶ Timeline</button>' +
        '</div>' +
      '</div>' +
      '<div class="inc-timeline" id="tl-'+inc.id+'"></div>' +
    '</div>';
  });
  el.innerHTML = html;
}

function toggleTimeline(id, e){
  if(e) e.stopPropagation();
  var tl = document.getElementById('tl-'+id);
  if(tl.classList.contains('show')){
    tl.classList.remove('show'); return;
  }
  // Carregar timeline
  fetch(API+'/api/incidentes/'+id+'/timeline', {headers:headers()})
  .then(function(r){return r.json();})
  .then(function(items){
    var html = '<div style="margin-bottom:10px;">';
    if(!items || !items.length){
      html += '<div style="color:var(--dim);font-size:12px;">Nenhuma atualização ainda</div>';
    } else {
      items.forEach(function(t){
        html += '<div class="tl-item">' +
          '<span class="tl-dot '+t.acao+'"></span>' +
          '<div class="tl-content">' +
            '<div class="tl-desc">'+esc(t.descricao)+'</div>' +
            '<div class="tl-meta">'+(t.usuario_nome||'Sistema')+' · '+(t.criado_em||'').substring(0,16)+'</div>' +
          '</div></div>';
      });
    }
    html += '</div>';
    html += '<div class="tl-add">' +
      '<input class="tl-input" type="text" id="tl-input-'+id+'" placeholder="Adicionar atualização...">' +
      '<button class="btn-tl" onclick="addTimeline('+id+')">ENVIAR</button>' +
    '</div>';
    tl.innerHTML = html;
    tl.classList.add('show');
  }).catch(function(){});
}

function addTimeline(id){
  var input = document.getElementById('tl-input-'+id);
  var desc = input.value.trim();
  if(!desc) return;
  fetch(API+'/api/incidentes/'+id+'/timeline', {
    method:'POST', headers:headers(),
    body:JSON.stringify({acao:'atualizacao', descricao:desc})
  }).then(function(){
    input.value = '';
    toggleTimeline(id); // fechar
    setTimeout(function(){ toggleTimeline(id); }, 100); // reabrir
  }).catch(function(){});
}

function resolver(id, e){
  e.stopPropagation();
  if(!confirm('Confirma resolução do incidente?')) return;
  fetch(API+'/api/incidentes/'+id, {
    method:'PUT', headers:headers(),
    body:JSON.stringify({status:'resolvido'})
  }).then(function(){ carregar(); }).catch(function(){});
}

function abrirIncidente(){
  var titulo = document.getElementById('f-titulo').value.trim();
  if(!titulo){ alert('Informe o título do incidente'); return; }
  var body = {
    titulo: titulo,
    tipo: document.getElementById('f-tipo').value,
    impacto: document.getElementById('f-impacto').value,
    clientes_afetados: parseInt(document.getElementById('f-clientes').value) || 0,
    descricao: document.getElementById('f-desc').value.trim()
  };
  fetch(API+'/api/incidentes', {
    method:'POST', headers:headers(), body:JSON.stringify(body)
  }).then(function(r){return r.json();})
  .then(function(){
    document.getElementById('f-titulo').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-clientes').value = '0';
    carregar();
  }).catch(function(){ alert('Erro ao abrir incidente'); });
}

function esc(s){return (s||'').replace(/[&<>"']/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

carregar();
setInterval(carregar, 30000);
</script>
</body>
</html>
