<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubNOC — Incidentes de Rede</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
:root{--bg:#0a0f1a;--surf:#0f1623;--surf2:#151e2e;--surf3:#1a2438;--border:#1e2d45;--border2:#243450;--text:#e2eaf4;--text2:#8ba3be;--text3:#4a6580;--blue:#00aaff;--green:#00e5a0;--red:#ff4466;--amber:#ffb830;--purple:#a78bfa;--orange:#fb923c;--radius:10px;--radius2:7px;--font:'Inter',system-ui,sans-serif;--sw:220px;--th:52px;}
body.light{--bg:#f0f4fa;--surf:#fff;--surf2:#e8edf5;--surf3:#dde3ef;--border:#cdd5e0;--border2:#bdc7d8;--text:#0f1623;--text2:#3a5070;--text3:#607a96;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;overflow:hidden;}
#shell{display:flex;height:100vh;}
#sb{width:var(--sw);background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;z-index:50;transition:width .25s cubic-bezier(.4,0,.2,1);}
#sb.col{width:52px;}
.sb-hd{padding:0 12px;height:var(--th);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.sb-li{width:30px;height:30px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--blue),#0055aa);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(0,170,255,.3);}
.sb-li svg{width:15px;height:15px;color:#fff;}
.sb-lt{font-size:15px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;}
.sb-lt span{color:var(--blue);}
.sb-tog{background:none;border:none;color:var(--text3);cursor:pointer;padding:5px;border-radius:5px;display:flex;flex-shrink:0;}
.sb-tog:hover{background:var(--surf2);color:var(--text);}
.sb-nav{flex:1;overflow-y:auto;padding:8px 6px;}
.sb-nav::-webkit-scrollbar{display:none;}
.sb-g{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:10px 8px 4px;white-space:nowrap;overflow:hidden;}
#sb.col .sb-g{display:none;}
.ni{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--radius2);cursor:pointer;color:var(--text2);transition:all .15s;position:relative;white-space:nowrap;overflow:hidden;user-select:none;text-decoration:none;}
.ni:hover{background:var(--surf2);color:var(--text);}
.ni.on{background:rgba(0,170,255,.1);color:var(--blue);}
.ni.on::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--blue);border-radius:0 2px 2px 0;}
.ni svg{width:16px;height:16px;flex-shrink:0;}
.ni-l{font-size:13px;font-weight:500;}
#sb.col .ni-l{display:none;}
#sb.col .ni{justify-content:center;padding:9px;}
.sb-ft{padding:10px 6px;border-top:1px solid var(--border);}
.sb-u{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius2);}
.sb-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--blue),var(--blue)88);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.sb-ui{min-width:0;flex:1;}
.sb-un{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-ug{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px;margin-top:1px;}
.sb-ug::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0;}
#sb.col .sb-ui{display:none;}
.btn-sair{width:100%;display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;background:rgba(255,68,102,.06);border:1px solid rgba(255,68,102,.15);color:var(--red);cursor:pointer;font-size:12px;font-weight:600;margin-bottom:6px;transition:.15s;}
.btn-sair:hover{background:rgba(255,68,102,.12);}
#sb.col .btn-sair span{display:none;}
#sb.col .btn-sair{justify-content:center;padding:9px;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#tb{height:var(--th);background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;position:relative;}
#tb::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--blue)40,transparent);}
.tb-title{font-size:14px;font-weight:700;flex:1;}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.clock{font-family:monospace;font-size:13px;color:var(--blue);font-weight:700;}
.btn-tv{display:flex;align-items:center;gap:6px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);color:#a78bfa;padding:6px 14px;border-radius:var(--radius2);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s;}
.btn-tv:hover{background:rgba(167,139,250,.2);}
.btn-th{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surf2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
#content{flex:1;overflow-y:auto;padding:20px 24px;}
#content::-webkit-scrollbar{width:4px;}
#content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border-bottom:2px solid var(--border);}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(0,170,255,.03);}
.badge{display:inline-block;padding:2px 8px;font-size:10px;font-weight:700;border-radius:20px;white-space:nowrap;}
.b-ok{background:rgba(0,229,160,.1);color:var(--green);}
.b-down{background:rgba(255,68,102,.1);color:var(--red);}
.b-aviso{background:rgba(255,184,48,.1);color:var(--amber);}
.b-azul{background:rgba(0,170,255,.1);color:var(--blue);}
.b-pause{background:rgba(74,101,128,.1);color:var(--text3);}
.b-ab{background:rgba(0,170,255,.1);color:var(--blue);}
.b-at{background:rgba(255,184,48,.1);color:var(--amber);}
.b-res{background:rgba(0,229,160,.1);color:var(--green);}
.b-crit{background:rgba(255,68,102,.15);color:var(--red);}
.b-inc{background:rgba(74,101,128,.1);color:var(--text3);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.d-ok{background:var(--green);box-shadow:0 0 4px var(--green);}
.d-down{background:var(--red);box-shadow:0 0 6px var(--red);animation:blink 1.5s infinite;}
.d-aviso{background:var(--amber);}
.d-pause{background:var(--text3);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.empty{text-align:center;padding:32px;color:var(--text3);font-size:13px;}
.ftab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surf2);color:var(--text3);transition:.15s;}
.ftab.on{background:var(--blue);color:#000;border-color:var(--blue);}
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.ov.show{display:flex;}
.modal{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);width:560px;max-width:95vw;max-height:88vh;overflow-y:auto;}
.modal::before{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--blue),transparent);border-radius:var(--radius) var(--radius) 0 0;}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);font-weight:800;font-size:15px;}
.mbd{padding:20px;}
.mft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.bx{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;}
.fr{margin-bottom:14px;}
.fr label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);margin-bottom:6px;text-transform:uppercase;}
.fr input,.fr select,.fr textarea{width:100%;background:var(--surf2);border:1px solid var(--border2);color:var(--text);padding:9px 12px;font-size:13px;font-family:var(--font);outline:none;border-radius:var(--radius2);transition:.2s;}
.fr input:focus,.fr select:focus,.fr textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,170,255,.1);}
.fr textarea{resize:vertical;min-height:80px;}
.fr select option{background:var(--surf2);}
.fr-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-p{background:linear-gradient(135deg,var(--blue),#0077cc);border:none;color:#fff;padding:9px 18px;border-radius:var(--radius2);font-size:13px;font-weight:700;cursor:pointer;}
.btn-p:hover{filter:brightness(1.1);}
.btn-s{background:var(--surf2);border:1px solid var(--border);color:var(--text2);padding:9px 16px;border-radius:var(--radius2);font-size:13px;cursor:pointer;}
.btn-r{background:rgba(255,68,102,.1);border:1px solid rgba(255,68,102,.25);color:var(--red);padding:9px 16px;border-radius:var(--radius2);font-size:13px;cursor:pointer;font-weight:600;}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;}
.info-row:last-child{border-bottom:none;}
.ik{color:var(--text3);}
.iv{font-weight:500;}
.tl-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;}
.tl-item:last-child{border-bottom:none;}
.tl-acao{font-weight:600;margin-bottom:2px;}
.tl-desc{color:var(--text3);margin-bottom:2px;}
.tl-meta{font-size:11px;color:var(--text3);font-family:monospace;}


</style>
</head>
<body>
<div id="shell">
<div id="sb">
  <div class="sb-hd">
    <div class="sb-logo">
      <div class="sb-li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg></div>
      <div class="sb-lt">Hub<span>NOC</span></div>
    </div>
    <button class="sb-tog" onclick="toggleSB()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </div>
  <nav class="sb-nav">
    <div class="sb-g">VISÃO GERAL</div>
    <a class="ni" href="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="ni-l">Dashboard</span></a>
    <div class="sb-g">ATENDIMENTO</div>
    <a class="ni" href="/chamados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 11 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.06 6.06l1.27-.53a2 2 0 012.11.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><span class="ni-l">Chamados</span></a>
    <a class="ni on" href="/incidentes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="ni-l">Incidentes</span></a>
    <a class="ni" href="/alertas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="ni-l">Alertas</span></a>
    <a class="ni" href="/cliente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="ni-l">Clientes</span></a>
    <div class="sb-g">MONITORAMENTO</div>
    <a class="ni" href="/sensores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span class="ni-l">Sensores PRTG</span></a>
    <a class="ni" href="/olts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07M8.46 8.46a5 5 0 000 7.07"/></svg><span class="ni-l">Monitor OLTs</span></a>
    <a class="ni" href="/mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg><span class="ni-l">Mapa de Rede</span></a>
    <div class="sb-g">SISTEMA</div>
    <a class="ni" href="/admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg><span class="ni-l">Administração</span></a>
  </nav>
  <div class="sb-ft">
    <button class="btn-sair" onclick="sair()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Sair</span></button>
    <div class="sb-u">
      <div class="sb-av" id="sb-av">A</div>
      <div class="sb-ui"><div class="sb-un" id="sb-nome">—</div><div class="sb-ug">Online</div></div>
    </div>
  </div>
</div>
<div id="main">
<div id="tb">
  <div class="tb-title">Incidentes de Rede</div>
  <div class="tb-right">
    <div class="clock" id="clock">—</div>
    <a class="btn-tv" href="/tv" target="_blank"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg> TV NOC</a>
    <button class="btn-th" id="btn-th" onclick="toggleTheme()">☀️</button>
  </div>
</div>
<div id="content">

<div style="display:grid;grid-template-columns:1fr 360px;gap:20px;height:calc(100vh - 52px - 40px);">
  <div style="overflow-y:auto;">
    <div class="ftabs">
      <div class="ftab on" onclick="filtrarInc('todos',this)">Todos</div>
      <div class="ftab" onclick="filtrarInc('aberto',this)">Abertos</div>
      <div class="ftab" onclick="filtrarInc('em_tratativa',this)">Em Tratativa</div>
      <div class="ftab" onclick="filtrarInc('resolvido',this)">Resolvidos</div>
    </div>
    <div id="lista-inc"><div class="empty">Carregando...</div></div>
  </div>
  <div class="card" style="height:fit-content;">
    <div class="sec-hd"><span class="sec-title">⚡ ABRIR INCIDENTE</span></div>
    <div class="fr"><label>Título</label><input type="text" id="inc-titulo" placeholder="Ex: OLT Neópolis DOWN"></div>
    <div class="fr"><label>Tipo</label><select id="inc-tipo"><option value="massivo">Massivo</option><option value="equipamento" selected>Equipamento</option><option value="link">Link</option><option value="energia">Energia</option><option value="outros">Outros</option></select></div>
    <div class="fr"><label>Impacto</label><select id="inc-impacto"><option value="baixo">Baixo</option><option value="medio" selected>Médio</option><option value="alto">Alto</option><option value="critico">Crítico</option></select></div>
    <div class="fr"><label>Clientes Afetados</label><input type="number" id="inc-clientes" value="0" min="0"></div>
    <div class="fr"><label>Descrição</label><textarea id="inc-desc" placeholder="Descreva o incidente..."></textarea></div>
    <button class="btn-p" style="width:100%;margin-top:4px;" onclick="abrirIncidente()">⚡ Abrir Incidente</button>
  </div>
</div>

<div class="ov" id="modal-inc">
  <div class="modal">
    <div class="mhd" id="minc-titulo">Incidente <button class="bx" onclick="fecharInc()">×</button></div>
    <div class="mbd" id="minc-body"></div>
    <div class="mft" id="minc-ft"></div>
  </div>
</div>

</div>

<script>

var API='';var token=localStorage.getItem('noc_token');
if(!token){window.location.href='/login';}
var _n=localStorage.getItem('noc_nome')||'—';
document.getElementById('sb-nome').textContent=_n;
document.getElementById('sb-av').textContent=_n.charAt(0).toUpperCase();
setInterval(function(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR');},1000);
document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR');
function toggleSB(){document.getElementById('sb').classList.toggle('col');}
function sair(){localStorage.clear();window.location.href='/login';}
function headers(){return{'Content-Type':'application/json','Authorization':'Bearer '+token};}
function esc(s){return(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtTempo(dt){if(!dt)return'—';var d=new Date(dt.replace(' ','T'));var diff=Math.floor((Date.now()-d.getTime())/60000);if(diff<60)return diff+'min';return Math.floor(diff/60)+'h'+(diff%60)+'m';}
function fmtData(dt){if(!dt)return'—';return(dt||'').substring(0,16).replace('T',' ');}
(function(){var t=localStorage.getItem('noc_theme');if(t==='light'){document.body.classList.add('light');document.getElementById('btn-th').textContent='🌙';}})();
function toggleTheme(){document.body.classList.toggle('light');var l=document.body.classList.contains('light');document.getElementById('btn-th').textContent=l?'🌙':'☀️';localStorage.setItem('noc_theme',l?'light':'dark');}


var _incStatus='todos';
function carregarIncidentes(){
  var url=API+'/api/incidentes'+(_incStatus!=='todos'?'?status='+_incStatus:'');
  fetch(url,{headers:headers()}).then(function(r){return r.json();}).then(function(l){
    var el=document.getElementById('lista-inc');
    if(!l||!l.length){el.innerHTML='<div class="empty">✓ Nenhum incidente encontrado</div>';return;}
    var h='';
    l.forEach(function(i){
      var imp=i.impacto||'medio';
      var cor=imp==='critico'?'var(--red)':imp==='alto'?'var(--orange)':imp==='medio'?'var(--amber)':'var(--green)';
      var bc=imp==='critico'?'b-crit':imp==='alto'?'b-aviso':'b-inc';
      var st=i.status==='aberto'?'b-down':i.status==='em_tratativa'?'b-aviso':'b-ok';
      h+='<div class="card" style="margin-bottom:10px;border-left:3px solid '+cor+';cursor:pointer;" onclick="verIncidente('+i.id+')">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">'+
          '<div style="font-size:15px;font-weight:800;flex:1;">⚡ '+esc(i.titulo)+'</div>'+
          '<span class="badge '+bc+'">'+imp.toUpperCase()+'</span>'+
          '<span class="badge '+st+'">'+esc(i.status)+'</span>'+
        '</div>'+
        '<div style="font-size:12px;color:var(--text3);">'+esc(i.tipo||'—')+' · '+i.clientes_afetados+' clientes afetados · Aberto há '+fmtTempo(i.aberto_em)+'</div>'+
        (i.descricao?'<div style="font-size:12px;color:var(--text2);margin-top:6px;">'+esc(i.descricao)+'</div>':'')+
      '</div>';
    });
    el.innerHTML=h;
  }).catch(function(){document.getElementById('lista-inc').innerHTML='<div class="empty">Erro ao carregar</div>';});
}
function filtrarInc(s,el){_incStatus=s;document.querySelectorAll('.ftab').forEach(function(t){t.classList.remove('on');});el.classList.add('on');carregarIncidentes();}
function abrirIncidente(){
  var titulo=document.getElementById('inc-titulo').value.trim();
  if(!titulo){alert('Informe o título');return;}
  var b={titulo:titulo,tipo:document.getElementById('inc-tipo').value,impacto:document.getElementById('inc-impacto').value,clientes_afetados:parseInt(document.getElementById('inc-clientes').value)||0,descricao:document.getElementById('inc-desc').value};
  fetch(API+'/api/incidentes',{method:'POST',headers:headers(),body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(){document.getElementById('inc-titulo').value='';document.getElementById('inc-desc').value='';carregarIncidentes();}).catch(function(){alert('Erro');});
}
function verIncidente(id){
  fetch(API+'/api/incidentes/'+id,{headers:headers()}).then(function(r){return r.json();}).then(function(i){
    var imp=i.impacto||'medio';var bc=imp==='critico'?'b-crit':imp==='alto'?'b-aviso':'b-inc';
    document.getElementById('minc-titulo').innerHTML='⚡ '+esc(i.titulo)+' <button class="bx" onclick="fecharInc()">×</button>';
    var tl=(i.timeline||[]).map(function(t){return'<div class="tl-item"><div class="tl-acao">'+esc(t.acao)+'</div><div class="tl-desc">'+esc(t.descricao||'')+'</div><div class="tl-meta">'+esc(t.usuario_nome||'—')+' · '+fmtData(t.criado_em)+'</div></div>';}).join('');
    document.getElementById('minc-body').innerHTML=
      '<div class="info-row"><span class="ik">Impacto</span><span class="iv"><span class="badge '+bc+'">'+imp.toUpperCase()+'</span></span></div>'+
      '<div class="info-row"><span class="ik">Tipo</span><span class="iv">'+esc(i.tipo||'—')+'</span></div>'+
      '<div class="info-row"><span class="ik">Clientes afetados</span><span class="iv">'+i.clientes_afetados+'</span></div>'+
      '<div class="info-row"><span class="ik">Aberto há</span><span class="iv">'+fmtTempo(i.aberto_em)+'</span></div>'+
      (i.descricao?'<div style="margin:12px 0;background:var(--surf2);border-radius:8px;padding:12px;font-size:13px;">'+esc(i.descricao)+'</div>':'')+
      '<div class="fr" style="margin-top:16px;"><label>Adicionar atualização</label><textarea id="tl-upd" placeholder="Descreva o andamento..."></textarea></div>'+
      (tl?'<div style="margin-top:8px;"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);margin-bottom:8px;">TIMELINE</div>'+tl+'</div>':'');
    var ft='<button class="btn-s" onclick="fecharInc()">Fechar</button>';
    ft+='<button class="btn-p" onclick="addTimeline('+id+')">+ Atualização</button>';
    if(i.status!=='resolvido')ft+='<button class="btn-r" onclick="resolverInc('+id+')">✓ Resolver</button>';
    document.getElementById('minc-ft').innerHTML=ft;
    document.getElementById('modal-inc').classList.add('show');
  }).catch(function(){alert('Erro');});
}
function fecharInc(){document.getElementById('modal-inc').classList.remove('show');}
function addTimeline(id){var desc=document.getElementById('tl-upd').value.trim();if(!desc){alert('Informe a atualização');return;}fetch(API+'/api/incidentes/'+id+'/timeline',{method:'POST',headers:headers(),body:JSON.stringify({acao:'atualizacao',descricao:desc})}).then(function(r){return r.json();}).then(function(){fecharInc();carregarIncidentes();verIncidente(id);}).catch(function(){alert('Erro');});}
function resolverInc(id){if(!confirm('Marcar como resolvido?'))return;fetch(API+'/api/incidentes/'+id,{method:'PUT',headers:headers(),body:JSON.stringify({status:'resolvido'})}).then(function(r){return r.json();}).then(function(){fecharInc();carregarIncidentes();}).catch(function(){alert('Erro');});}
carregarIncidentes();

</script>
</body>
</html>
