<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubNOC — Mapa de Rede</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#070d14;--panel:#0d1a26;--border:#1a3a5c;--green:#00ff88;--blue:#00aaff;--red:#ff3366;--yellow:#ffcc00;--orange:#ff8800;--text:#c8dde8;--dim:#4a7a9b;}
  body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;height:100vh;display:flex;flex-direction:column;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
  .logo{font-family:'Share Tech Mono',monospace;font-size:18px;color:var(--blue);letter-spacing:3px;}
  .nav-links{display:flex;gap:4px;}
  .nav-link{padding:6px 14px;font-size:12px;letter-spacing:1px;text-decoration:none;color:var(--dim);border:1px solid transparent;transition:.2s;cursor:pointer;font-family:'Share Tech Mono',monospace;}
  .nav-link:hover,.nav-link.ativo{color:var(--blue);border-color:var(--border);}
  .topbar-right{display:flex;align-items:center;gap:16px;}
  .user-info{font-size:12px;color:var(--dim);font-family:'Share Tech Mono',monospace;}
  .btn-sair{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 12px;font-size:11px;cursor:pointer;}
  .btn-sair:hover{border-color:var(--red);color:var(--red);}

  /* Layout mapa + painel */
  .layout{display:flex;flex:1;overflow:hidden;}
  #mapa{flex:1;min-height:0;height:100%;}

  /* Painel lateral */
  .painel{width:340px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;}
  .painel-header{padding:12px 16px;border-bottom:1px solid var(--border);
    font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--blue);}
  .painel-body{flex:1;overflow-y:auto;padding:14px;}
  .painel-body::-webkit-scrollbar{width:4px;}
  .painel-body::-webkit-scrollbar-thumb{background:var(--border);}

  /* Legenda */
  .legenda{padding:12px 16px;border-top:1px solid var(--border);
    font-size:11px;font-family:'Share Tech Mono',monospace;}
  .leg-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--dim);}
  .leg-dot{width:12px;height:12px;border-radius:50%;}

  /* Filtros mapa */
  .filtros-mapa{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .filtro-mapa{background:none;border:1px solid var(--border);color:var(--dim);
    padding:4px 10px;font-size:11px;cursor:pointer;font-family:'Share Tech Mono',monospace;}
  .filtro-mapa.ativo{border-color:var(--blue);color:var(--blue);}

  /* Card OLT selecionada */
  .olt-card-sel{background:rgba(0,170,255,.05);border:1px solid var(--border);
    border-top:2px solid var(--blue);padding:14px;margin-bottom:12px;}
  .olt-card-nome{font-size:14px;font-weight:700;margin-bottom:6px;}
  .olt-card-meta{font-size:11px;color:var(--dim);font-family:'Share Tech Mono',monospace;
    display:flex;flex-direction:column;gap:3px;}
  .olt-card-meta span{color:var(--text);}
  .kpi-mini-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
  .kpi-mini-box{background:var(--bg);border:1px solid var(--border);padding:8px;text-align:center;}
  .kpi-mini-v{font-size:20px;font-weight:700;font-family:'Share Tech Mono',monospace;}
  .kpi-mini-l{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px;}
  .btn-ver-olt{display:block;width:100%;background:none;border:1px solid var(--blue);
    color:var(--blue);padding:8px;font-family:'Share Tech Mono',monospace;font-size:11px;
    letter-spacing:2px;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none;}
  .btn-ver-olt:hover{background:rgba(0,170,255,.1);}

  /* Lista OLTs no painel */
  .olt-lista-item{display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid rgba(26,58,92,.4);cursor:pointer;transition:.2s;}
  .olt-lista-item:hover{padding-left:4px;}
  .olt-lista-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .olt-lista-info{flex:1;min-width:0;}
  .olt-lista-nome{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .olt-lista-sub{font-size:10px;color:var(--dim);font-family:'Share Tech Mono',monospace;}
  .olt-lista-stat{font-family:'Share Tech Mono',monospace;font-size:13px;font-weight:700;}

  /* Popup leaflet customizado */
  .leaflet-popup-content-wrapper{
    background:var(--panel)!important;border:1px solid var(--border)!important;
    border-radius:0!important;color:var(--text)!important;
    box-shadow:0 0 20px rgba(0,170,255,.2)!important;}
  .leaflet-popup-tip{background:var(--panel)!important;}
  .leaflet-popup-content{margin:12px 16px!important;font-family:'Exo 2',sans-serif!important;}
  .popup-nome{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px;
    font-family:'Share Tech Mono',monospace;letter-spacing:1px;}
  .popup-row{display:flex;justify-content:space-between;font-size:12px;
    padding:3px 0;border-bottom:1px solid rgba(26,58,92,.3);}
  .popup-row:last-child{border-bottom:none;}
  .popup-label{color:var(--dim);}
  .popup-val{font-family:'Share Tech Mono',monospace;font-weight:600;}
  .popup-val.ok{color:var(--green);}
  .popup-val.bad{color:var(--red);}
  .popup-val.warn{color:var(--yellow);}
  .popup-link{display:block;text-align:center;margin-top:8px;padding:5px;
    background:rgba(0,170,255,.1);border:1px solid rgba(0,170,255,.3);
    color:var(--blue);font-family:'Share Tech Mono',monospace;font-size:11px;
    text-decoration:none;letter-spacing:1px;}
  .popup-link:hover{background:rgba(0,170,255,.2);}

  /* Controles mapa */
  .ctrl-mapa{position:absolute;top:70px;left:10px;z-index:1000;display:flex;flex-direction:column;gap:4px;}
  .ctrl-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Share Tech Mono',monospace;
    white-space:nowrap;}
  .ctrl-btn.ativo{border-color:var(--blue);color:var(--blue);}
  .ctrl-btn:hover{border-color:var(--blue);}

  .vazio{text-align:center;padding:24px;color:var(--dim);
    font-family:'Share Tech Mono',monospace;font-size:12px;}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="logo">📡 HubNOC</div>
    <div class="nav-links">
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/chamados">Chamados</a>
      <a class="nav-link" href="/sensores">Sensores</a>
      <a class="nav-link" href="/incidentes">Incidentes</a>
      <a class="nav-link" href="/cliente">Clientes</a>
      <a class="nav-link" href="/olts">OLTs</a>
      <a class="nav-link ativo" href="/mapa">🗺 Mapa</a>
      <a class="nav-link" href="/tv" target="_blank">📺 TV</a>
    </div>
  </div>
  <div class="topbar-right">
    <div class="user-info" id="user-nome">—</div>
    <button class="btn-sair" onclick="sair()">SAIR</button>
  </div>
</div>

<div class="layout">
  <div style="position:relative;flex:1;">
    <div id="mapa"></div>
    <div class="ctrl-mapa">
      <button class="ctrl-btn ativo" onclick="toggleCamada('olts',this)">📡 OLTs</button>
      <button class="ctrl-btn ativo" onclick="toggleCamada('caixas',this)">📦 Caixas FTTH</button>
      <button class="ctrl-btn" onclick="centralizarMapa()">⊕ Centralizar</button>
    </div>
  </div>

  <!-- Painel lateral -->
  <div class="painel">
    <div class="painel-header">🗺 MAPA DE REDE</div>
    <div class="painel-body">

      <!-- OLT selecionada -->
      <div id="painel-olt-sel">
        <div class="vazio">Clique em uma OLT no mapa para ver detalhes</div>
      </div>

      <!-- Lista de OLTs -->
      <div style="font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;
        color:var(--dim);margin-bottom:8px;margin-top:4px;">TODAS AS OLTs</div>
      <div id="lista-lateral"></div>
    </div>

    <div class="legenda">
      <div class="leg-item"><span class="leg-dot" style="background:#00ff88;box-shadow:0 0 6px #00ff88"></span>OLT Online (OK)</div>
      <div class="leg-item"><span class="leg-dot" style="background:#ff3366;box-shadow:0 0 6px #ff3366;animation:blink 1.5s infinite"></span>OLT DOWN</div>
      <div class="leg-item"><span class="leg-dot" style="background:#ffcc00"></span>OLT Aviso</div>
      <div class="leg-item"><span class="leg-dot" style="background:#00aaff"></span>Caixa FTTH</div>
    </div>
  </div>
</div>

<script>
var API = '';
var token = localStorage.getItem('noc_token');
if(!token){ window.location.href = '/login'; }
document.getElementById('user-nome').textContent = localStorage.getItem('noc_nome') || '—';

function sair(){ localStorage.clear(); window.location.href = '/login'; }
function headers(){ return {'Authorization':'Bearer '+token}; }

// ── Mapa ─────────────────────────────────────────────────────
var mapa = L.map('mapa', {zoomControl:false}).setView([-10.42, -36.58], 10);

// Tile escuro
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap',maxZoom:19}).addTo(mapa);

L.control.zoom({position:'topright'}).addTo(mapa);

var camadaOLTs   = L.layerGroup().addTo(mapa);
var camadaCaixas = L.layerGroup().addTo(mapa);
var camadaLinks  = L.layerGroup().addTo(mapa);
var camadas = {olts: camadaOLTs, caixas: camadaCaixas};

var oltsData = [];

// ── Ícones customizados ───────────────────────────────────────
function criarIconeOLT(status, tam){
  tam = tam || 18;
  var cor = status === 'DOWN' ? '#ff3366' : status === 'Aviso' ? '#ffcc00' : '#00ff88';
  var brilho = status === 'DOWN' ? 'rgba(255,51,102,.4)' : status === 'Aviso' ? 'rgba(255,204,0,.3)' : 'rgba(0,255,136,.3)';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+(tam*2)+'" height="'+(tam*2)+'" viewBox="0 0 36 36">' +
    '<circle cx="18" cy="18" r="14" fill="'+brilho+'"/>' +
    '<circle cx="18" cy="18" r="8" fill="'+cor+'" stroke="#0d1a26" stroke-width="2"/>' +
    '<circle cx="18" cy="18" r="3" fill="#0d1a26"/>' +
  '</svg>';
  return L.divIcon({
    html: svg, className:'', iconSize:[tam*2,tam*2], iconAnchor:[tam,tam], popupAnchor:[0,-tam]
  });
}

function criarIconeCaixa(){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10">' +
    '<circle cx="5" cy="5" r="4" fill="rgba(0,170,255,.5)" stroke="#00aaff" stroke-width="1"/>' +
  '</svg>';
  return L.divIcon({html:svg, className:'', iconSize:[10,10], iconAnchor:[5,5]});
}

// ── Carregar OLTs ─────────────────────────────────────────────
function carregarOLTs(){
  fetch(API+'/api/olts', {headers:headers()})
  .then(function(r){return r.json();})
  .then(function(lista){
    oltsData = lista;
    camadaOLTs.clearLayers();
    camadaLinks.clearLayers();

    var listaHtml = '';
    var bounds = [];

    lista.forEach(function(o){
      if(!o.lat && !o.latitude) return; // sem coord da API — buscar abaixo

      var lat = parseFloat(o.latitude || o.lat);
      var lon = parseFloat(o.longitude || o.lon);
      if(!lat || !lon) return;

      bounds.push([lat, lon]);

      var icone = criarIconeOLT(o.prtg_status, 18);
      var marker = L.marker([lat, lon], {icon: icone}).addTo(camadaOLTs);

      // Popup
      var pctCls = o.pct_online >= 90 ? 'ok' : o.pct_online >= 70 ? 'warn' : 'bad';
      var popupHtml = '<div class="popup-nome">📡 '+esc(o.olt_nome)+'</div>' +
        '<div class="popup-row"><span class="popup-label">POP</span><span class="popup-val">'+esc(o.pop_nome||'—')+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">Modelo</span><span class="popup-val">'+esc(o.modelo||'—')+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">Total clientes</span><span class="popup-val">'+o.total_clientes+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">Online</span><span class="popup-val ok">'+o.online+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">⚠ Problema</span><span class="popup-val bad">'+(o.offline_problema||0)+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">% Online</span><span class="popup-val '+pctCls+'">'+o.pct_online+'%</span></div>' +
        '<div class="popup-row"><span class="popup-label">Tráfego</span><span class="popup-val ok">'+esc(o.prtg_trafico||'—')+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">PRTG</span><span class="popup-val '+(o.prtg_status==='OK'?'ok':'bad')+'">'+esc(o.prtg_status)+'</span></div>' +
        (o.uptime ? '<div class="popup-row"><span class="popup-label">Uptime</span><span class="popup-val ok">'+esc(o.uptime)+'</span></div>' : '') +
        '<a class="popup-link" href="/olts" onclick="sessionStorage.setItem(\'olt_id\','+o.olt_id+')">▶ VER DETALHE</a>';

      marker.bindPopup(popupHtml, {maxWidth:280, minWidth:240});
      marker.on('click', function(){ selecionarOLTpainel(o); });

      // Lista lateral
      var dotCor = o.prtg_status==='DOWN'?'var(--red)':o.prtg_status==='Aviso'?'var(--yellow)':'var(--green)';
      var statCor = o.pct_online>=90?'var(--green)':o.pct_online>=70?'var(--yellow)':'var(--red)';
      listaHtml += '<div class="olt-lista-item" onclick="focarOLT('+lat+','+lon+',\''+esc(o.olt_nome)+'\')">' +
        '<span class="olt-lista-dot" style="background:'+dotCor+'"></span>' +
        '<div class="olt-lista-info">' +
          '<div class="olt-lista-nome" title="'+esc(o.olt_nome)+'">'+esc(o.olt_nome)+'</div>' +
          '<div class="olt-lista-sub">'+esc(o.pop_nome||'—')+'</div>' +
        '</div>' +
        '<div class="olt-lista-stat" style="color:'+statCor+'">'+o.online+'/'+o.total_clientes+'</div>' +
      '</div>';
    });

    document.getElementById('lista-lateral').innerHTML = listaHtml || '<div class="vazio">Nenhuma OLT com coordenadas</div>';

    if(bounds.length > 1){
      mapa.fitBounds(bounds, {padding:[40,40]});
    }
  }).catch(function(){});
}

// Carregar OLTs com coordenadas do IXC diretamente
function carregarOLTsComCoord(){
  fetch(API+'/api/olts/mapa', {headers:headers()})
  .then(function(r){return r.json();})
  .then(function(lista){
    camadaOLTs.clearLayers();
    var listaHtml = '';
    var bounds = [];

    lista.forEach(function(o){
      var lat = parseFloat(o.latitude);
      var lon = parseFloat(o.longitude);
      if(!lat || !lon) return;
      bounds.push([lat,lon]);

      var icone = criarIconeOLT(o.prtg_status, 18);
      var marker = L.marker([lat,lon], {icon:icone}).addTo(camadaOLTs);

      var pctCls = o.pct_online>=90?'ok':o.pct_online>=70?'warn':'bad';
      var popupHtml =
        '<div class="popup-nome">📡 '+esc(o.olt_nome)+'</div>' +
        '<div class="popup-row"><span class="popup-label">POP</span><span class="popup-val">'+esc(o.pop_nome||'—')+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">Modelo</span><span class="popup-val">'+esc(o.modelo||'—')+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">Total clientes</span><span class="popup-val">'+o.total_clientes+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">Online</span><span class="popup-val ok">'+o.online+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">⚠ Problema</span><span class="popup-val bad">'+(o.offline_problema||0)+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">% Online</span><span class="popup-val '+pctCls+'">'+o.pct_online+'%</span></div>' +
        '<div class="popup-row"><span class="popup-label">Tráfego PRTG</span><span class="popup-val ok">'+esc(o.prtg_trafico||'—')+'</span></div>' +
        '<div class="popup-row"><span class="popup-label">Status PRTG</span><span class="popup-val '+(o.prtg_status==='OK'?'ok':'bad')+'">'+esc(o.prtg_status)+'</span></div>' +
        (o.uptime?'<div class="popup-row"><span class="popup-label">Uptime</span><span class="popup-val ok">'+esc(o.uptime)+'</span></div>':'') +
        '<a class="popup-link" href="/olts">▶ VER DETALHE NO PAINEL</a>';

      marker.bindPopup(popupHtml, {maxWidth:280, minWidth:240});
      marker.on('click', function(){ selecionarOLTpainel(o); });

      var dotCor = o.prtg_status==='DOWN'?'var(--red)':o.prtg_status==='Aviso'?'var(--yellow)':'var(--green)';
      var statCor = o.pct_online>=90?'var(--green)':o.pct_online>=70?'var(--yellow)':'var(--red)';
      listaHtml += '<div class="olt-lista-item" onclick="focarOLT('+lat+','+lon+')">' +
        '<span class="olt-lista-dot" style="background:'+dotCor+'"></span>' +
        '<div class="olt-lista-info">' +
          '<div class="olt-lista-nome" title="'+esc(o.olt_nome)+'">'+esc(o.olt_nome)+'</div>' +
          '<div class="olt-lista-sub">'+esc(o.pop_nome||'—')+'</div>' +
        '</div>' +
        '<div class="olt-lista-stat" style="color:'+statCor+'">'+o.online+'/'+o.total_clientes+'</div>' +
      '</div>';
    });

    document.getElementById('lista-lateral').innerHTML = listaHtml;
    if(bounds.length > 1) mapa.fitBounds(bounds, {padding:[60,60]});
  }).catch(function(){ carregarOLTs(); });
}

// ── Caixas FTTH ───────────────────────────────────────────────
var caixasCarregadas = false;
function carregarCaixas(){
  if(caixasCarregadas) return;
  fetch(API+'/api/olts/caixas', {headers:headers()})
  .then(function(r){return r.json();})
  .then(function(lista){
    caixasCarregadas = true;
    var icone = criarIconeCaixa();
    lista.forEach(function(c){
      var lat = parseFloat(c.latitude);
      var lon = parseFloat(c.longitude);
      if(!lat || !lon) return;
      var m = L.marker([lat,lon], {icon:icone}).addTo(camadaCaixas);
      m.bindTooltip('<b>'+esc(c.descricao)+'</b><br>Cap: '+c.capacidade+' | '+esc(c.bairro||''), {sticky:true});
    });
  }).catch(function(){});
}

// ── Painel lateral OLT selecionada ────────────────────────────
function selecionarOLTpainel(o){
  var pctCor = o.pct_online>=90?'var(--green)':o.pct_online>=70?'var(--yellow)':'var(--red)';
  var html = '<div class="olt-card-sel">' +
    '<div class="olt-card-nome">'+esc(o.olt_nome)+'</div>' +
    '<div class="olt-card-meta">' +
      '<div>POP: <span>'+esc(o.pop_nome||'—')+'</span></div>' +
      '<div>IP: <span>'+esc(o.ip||'—')+'</span></div>' +
      '<div>Modelo: <span>'+esc(o.modelo||'—')+'</span></div>' +
      (o.uptime?'<div>Uptime: <span style="color:var(--green)">'+esc(o.uptime)+'</span></div>':'') +
      '<div>PRTG: <span style="color:'+(o.prtg_status==='OK'?'var(--green)':'var(--red)')+'">'+esc(o.prtg_status)+'</span></div>' +
      '<div>Tráfego: <span style="color:var(--blue)">'+esc(o.prtg_trafico||'—')+'</span></div>' +
    '</div>' +
    '<div class="kpi-mini-row">' +
      '<div class="kpi-mini-box"><div class="kpi-mini-v" style="color:var(--blue)">'+o.total_clientes+'</div><div class="kpi-mini-l">TOTAL</div></div>' +
      '<div class="kpi-mini-box"><div class="kpi-mini-v" style="color:var(--green)">'+o.online+'</div><div class="kpi-mini-l">ONLINE</div></div>' +
      '<div class="kpi-mini-box"><div class="kpi-mini-v" style="color:var(--red)">'+(o.offline_problema||0)+'</div><div class="kpi-mini-l">PROBLEMA</div></div>' +
      '<div class="kpi-mini-box"><div class="kpi-mini-v" style="color:'+pctCor+'">'+o.pct_online+'%</div><div class="kpi-mini-l">% ONLINE</div></div>' +
    '</div>' +
    '<a class="btn-ver-olt" href="/olts">▶ VER DETALHE COMPLETO</a>' +
  '</div>';
  document.getElementById('painel-olt-sel').innerHTML = html;
}

function focarOLT(lat, lon){
  mapa.setView([lat, lon], 13, {animate:true});
}

function toggleCamada(nome, btn){
  btn.classList.toggle('ativo');
  if(btn.classList.contains('ativo')){
    camadas[nome].addTo(mapa);
    if(nome === 'caixas') carregarCaixas();
  } else {
    mapa.removeLayer(camadas[nome]);
  }
}

function centralizarMapa(){
  mapa.setView([-10.42, -36.58], 10, {animate:true});
}

function esc(s){return (s||'').replace(/[&<>"']/g,function(c){
