<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubNOC — Cliquedf</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#070d14;--panel:#0d1a26;--border:#1a3a5c;
    --green:#00ff88;--blue:#00aaff;--red:#ff3366;
    --text:#c8dde8;--dim:#4a7a9b;
  }
  body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;
       overflow:hidden;}

  /* Grid animado de fundo */
  .bg-grid{position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(0,170,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,170,255,.04) 1px,transparent 1px);
    background-size:40px 40px;
    animation:gridMove 20s linear infinite;}
  @keyframes gridMove{0%{background-position:0 0}100%{background-position:40px 40px}}

  /* Pulso de radar */
  .radar{position:fixed;top:50%;left:50%;width:800px;height:800px;
         transform:translate(-50%,-50%);pointer-events:none;}
  .radar-ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid;
              transform:translate(-50%,-50%);animation:radarPulse 4s ease-out infinite;}
  .radar-ring:nth-child(1){width:200px;height:200px;border-color:rgba(0,170,255,.3);animation-delay:0s}
  .radar-ring:nth-child(2){width:400px;height:400px;border-color:rgba(0,170,255,.2);animation-delay:1s}
  .radar-ring:nth-child(3){width:600px;height:600px;border-color:rgba(0,170,255,.1);animation-delay:2s}
  .radar-ring:nth-child(4){width:800px;height:800px;border-color:rgba(0,170,255,.05);animation-delay:3s}
  @keyframes radarPulse{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

  .login-card{
    position:relative;z-index:10;
    background:var(--panel);
    border:1px solid var(--border);
    border-top:2px solid var(--blue);
    padding:40px;width:380px;
    box-shadow:0 0 60px rgba(0,170,255,.1),inset 0 0 30px rgba(0,0,0,.3);
  }

  .logo-area{text-align:center;margin-bottom:32px;}
  .logo-icon{font-size:40px;display:block;margin-bottom:8px;
    filter:drop-shadow(0 0 12px var(--blue));}
  .logo-title{font-family:'Share Tech Mono',monospace;font-size:22px;
    color:var(--blue);letter-spacing:4px;text-transform:uppercase;}
  .logo-sub{font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:4px;}

  .status-bar{display:flex;align-items:center;gap:8px;
    background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.2);
    padding:8px 12px;margin-bottom:24px;font-size:12px;font-family:'Share Tech Mono',monospace;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);animation:blink 2s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--dim);margin-bottom:6px;font-family:'Share Tech Mono',monospace;}
  .field{margin-bottom:20px;}
  input{width:100%;background:rgba(0,170,255,.05);border:1px solid var(--border);
    color:var(--text);padding:12px 14px;font-size:14px;font-family:'Exo 2',sans-serif;
    outline:none;transition:.2s;}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,170,255,.1);}

  .btn-login{width:100%;padding:14px;background:transparent;
    border:1px solid var(--blue);color:var(--blue);
    font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:3px;
    text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;
    transition:.3s;}
  .btn-login::before{content:'';position:absolute;inset:0;background:var(--blue);
    transform:translateX(-101%);transition:.3s;}
  .btn-login:hover::before{transform:translateX(0)}
  .btn-login:hover{color:var(--bg);}
  .btn-login span{position:relative;z-index:1;}

  .erro{display:none;background:rgba(255,51,102,.1);border:1px solid var(--red);
    color:var(--red);padding:10px 14px;font-size:13px;margin-top:12px;
    font-family:'Share Tech Mono',monospace;}

  .footer-info{text-align:center;margin-top:24px;font-size:11px;
    color:var(--dim);font-family:'Share Tech Mono',monospace;letter-spacing:1px;}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="radar">
  <div class="radar-ring"></div><div class="radar-ring"></div>
  <div class="radar-ring"></div><div class="radar-ring"></div>
</div>

<div class="login-card">
  <div class="logo-area">
    <span class="logo-icon">📡</span>
    <div class="logo-title">HubNOC</div>
    <div class="logo-sub">CLIQUEDF · NETWORK OPERATIONS</div>
  </div>

  <div class="status-bar">
    <span class="status-dot"></span>
    <span>SISTEMA OPERACIONAL</span>
  </div>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="login" placeholder="login" autocomplete="username">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" onclick="fazerLogin()"><span>► ACESSAR SISTEMA</span></button>
  <div class="erro" id="erro">⚠ Login ou senha inválidos</div>

  <div class="footer-info">IaTechHub · HubNOC v1.0</div>
</div>

<script>
var API = '';

document.getElementById('senha').addEventListener('keypress', function(e){
  if(e.key === 'Enter') fazerLogin();
});

function fazerLogin(){
  var login = document.getElementById('login').value.trim();
  var senha = document.getElementById('senha').value;
  if(!login || !senha) return;

  fetch(API + '/api/auth/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({login:login, senha:senha})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.token){
      localStorage.setItem('noc_token', d.token);
      localStorage.setItem('noc_nome', d.nome);
      localStorage.setItem('noc_nivel', d.nivel);
      window.location.href = '/dashboard';
    } else {
      document.getElementById('erro').style.display = 'block';
    }
  })
  .catch(function(){
    document.getElementById('erro').style.display = 'block';
  });
}
</script>
</body>
</html>
